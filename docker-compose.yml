services:
  db:
    image: postgres:16-alpine
    container_name: kfokam48-db
    environment:
      POSTGRES_DB: kfokam48
      POSTGRES_USER: kfokam48
      POSTGRES_PASSWORD: kfokam48
    ports:
      - "5432:5432"
    volumes:
      - kfokam48-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfokam48 -d kfokam48"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kfokam48-pgdata:
