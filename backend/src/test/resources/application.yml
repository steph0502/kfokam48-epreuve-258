spring:
  datasource:
    # H2 en mémoire, mode compatibilité PostgreSQL : les tests tournent sur un
    # poste vierge, sans base locale ni docker (contrainte B6). Migrations Flyway
    # identiques (V1, V2) exécutées à chaque contexte de test.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
